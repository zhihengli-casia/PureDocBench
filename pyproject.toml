[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "puredocbench"
version = "0.1.0"
description = "Public inference and scoring utilities for PureDocBench"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "PureDocBench authors"}
]
dependencies = [
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0"
]

[project.scripts]
puredocbench = "puredocbench.cli:main"

[tool.setuptools]
packages = ["puredocbench"]
