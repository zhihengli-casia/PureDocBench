model:
  name: Kimi-K2.6
  slug: kimi_k2_6
  family: kimi
  api_id: Pro/moonshotai/Kimi-K2.6
  enable_thinking: false
  via: SiliconFlow

prompt:
  source: OmniDocBench/tools/model_infer/Qwen3-VL-235B_img2md.py
  file: prompts/kimi_k2_6.txt

dataset:
  name: PureDocBench
  manifest: ${PDB_MANIFEST_JSON}
  images_root: ${PDB_DATASET_ROOT}/images/clean
  total_pages: 1474
  smoke_count: 5

runtime:
  env_python: ${PDB_ENV_ROOT}/vllm_qwen3/bin/python
  script: tools/api_infer/kimi_k2_6.py
  prediction_dir: predictions/api/kimi_k2_6
  smoke_output_dir: outputs_smoke/api/kimi_k2_6
  log_dir: logs/

api:
  provider: siliconflow
  base_url: https://api.siliconflow.cn/v1
  key_env_var: SILICONFLOW_API_KEY
  key_file: .env
  default_concurrency: 8
  request_timeout_sec: 180
  retry_max: 4
  retry_backoff_base_sec: 5

inference:
  temperature: 0.0
  max_output_tokens: 8192
  image_transport: base64
